# Business Rules & Scoring Configuration
# NOTE: Quantile benchmarks and thresholds are calibrated empirically 
# upon inspecting the historical operational dataset (no invented thresholds).

operational_benchmarks:
  # Baseline days per month for standardized projections
  days_per_month: 30

scoring:
  # Location suitability score calculation weights (sum to 1.0)
  weights:
    bottles_daily_weight: 0.45
    presenze_daily_weight: 0.35
    bottles_per_person_weight: 0.20

  # Target benchmarks for normalization (will be fitted to empirical quantiles)
  benchmarks:
    # Example placeholders calibrated to empirical percentiles during EDA
    bottles_daily_target_p90: 1000.0
    presenze_daily_target_p90: 35.0
    bottles_per_person_target: 30.0

recommendations:
  # Official Coripet volume performance tiers (bottles/day)
  tiers:
    super_prendente:
      min_daily_bottles: 2000.0
      label: "SUPER PRENDENTE"
      description: "Hub strategico di eccellenza (> 2.000 b/giorno) ad altissima rotazione."
    alto_prendente:
      min_daily_bottles: 1000.0
      max_daily_bottles: 2000.0
      label: "ALTO PRENDENTE"
      description: "Top performer commerciale (1.000 - 2.000 b/giorno) ad alto rendimento."
    medio_prendente:
      min_daily_bottles: 300.0
      max_daily_bottles: 1000.0
      label: "MEDIO PRENDENTE"
      description: "Benchmark di rete standard sostenibile (300 - 1.000 b/giorno)."
    basso_prendente:
      min_daily_bottles: 0.0
      max_daily_bottles: 300.0
      label: "BASSO PRENDENTE"
      description: "Volume contenuto (< 300 b/giorno); richiede presidio o monitoraggio costi."

confidence:
  # Factors determining prediction confidence: HIGH, MEDIUM, LOW
  factors:
    postal_code_exact_match_weight: 0.40
    retail_chain_known_weight: 0.35
    geo_proximity_weight: 0.25
  thresholds:
    high_confidence_min_score: 0.80
    medium_confidence_min_score: 0.55

suitability_gates:
  # Operational and economic clearance thresholds
  economic_breakeven_daily_bottles: 120.0
  critical_cannibalization_distance_km: 0.25
  critical_dilution_percentage: 35.0
  min_sales_area_sqm: 150.0
  min_cash_registers: 2.0
  min_population_isolated: 2000.0
  min_population_density_isolated: 60.0
  
  # Hardware sizing thresholds
  heavy_duty_min_daily_bottles: 250.0
  compact_max_daily_bottles: 600.0
  
  # Logistics feasibility thresholds
  isolated_outpost_distance_km: 25.0
  isolated_min_daily_bottles: 250.0
  
  # Commercial loyalty alliance thresholds
  independent_min_daily_bottles: 180.0


